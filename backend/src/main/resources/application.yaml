spring:
  application:
    name: campus-forum
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/campus_forum?connectionTimeZone=UTC}
    username: ${DB_USERNAME:campus}
    password: ${DB_PASSWORD:campus_local}
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
  flyway:
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
app:
  dev-login:
    enabled: false
