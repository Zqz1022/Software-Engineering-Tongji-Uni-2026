name: 用户故事
description: 将 US 编号与实现、验收和负责人关联
title: '[US-XX] '
body:
  - type: input
    id: requirement
    attributes:
      label: 需求编号与文档
      description: 保留原 US 编号，并链接需求条目。
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: 用户故事
      placeholder: 作为……，我希望……，以便……
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      value: |
        Given：
        When：
        Then：
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: 任务、依赖与协作者
      description: 写明接口、前后端分工、相关任务和依赖；在侧栏设置一名 Assignee 和 Milestone。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 验收证据
      description: 完成时补充 PR、CI、测试报告和演示记录链接。
