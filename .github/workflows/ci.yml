name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm api:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4.8
        env:
          MYSQL_DATABASE: campus_forum_test
          MYSQL_USER: campus_test
          MYSQL_PASSWORD: campus_test
          MYSQL_ROOT_PASSWORD: test_root_local
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysql -h 127.0.0.1 -ucampus_test -pcampus_test campus_forum_test -e 'SELECT 1'"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: backend/.cache/maven/repository
          key: maven-${{ runner.os }}-java21-${{ hashFiles('backend/pom.xml', 'backend/.mvn/*.xml', 'backend/.mvn/maven.config') }}
      - name: Unit tests, MySQL integration tests and package
        working-directory: backend
        run: ./mvnw --batch-mode verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/site/jacoco/
      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/campus-forum-0.0.1-SNAPSHOT.jar
          if-no-files-found: error

  e2e:
    name: Browser checks
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4.8
        env:
          MYSQL_DATABASE: campus_forum_test
          MYSQL_USER: campus_test
          MYSQL_PASSWORD: campus_test
          MYSQL_ROOT_PASSWORD: test_root_local
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysql -h 127.0.0.1 -ucampus_test -pcampus_test campus_forum_test -e 'SELECT 1'"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target
      - working-directory: frontend
        run: pnpm install --frozen-lockfile
      - working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Start backend with isolated fixture database
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_URL: jdbc:mysql://localhost:3308/campus_forum_test?connectionTimeZone=UTC
          DB_USERNAME: campus_test
          DB_PASSWORD: campus_test
        run: |
          java -jar backend/target/campus-forum-0.0.1-SNAPSHOT.jar > "$RUNNER_TEMP/backend.log" 2>&1 &
          node scripts/wait-for-http.mjs http://127.0.0.1:8080/actuator/health
      - working-directory: frontend
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-reports
          path: |
            frontend/playwright-report/
            frontend/test-results/
            ${{ runner.temp }}/backend.log
