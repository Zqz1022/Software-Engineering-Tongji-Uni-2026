name: see2026
services:
  db:
    image: mysql:8.4.8
    ports:
      - '127.0.0.1:${MYSQL_PORT:-3307}:3306'
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campus_forum}
      MYSQL_USER: ${MYSQL_USER:-campus}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-campus_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local}
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  test-db:
    image: mysql:8.4.8
    profiles: [test]
    ports:
      - '127.0.0.1:${TEST_MYSQL_PORT:-3308}:3306'
    environment:
      MYSQL_DATABASE: campus_forum_test
      MYSQL_USER: campus_test
      MYSQL_PASSWORD: campus_test
      MYSQL_ROOT_PASSWORD: test_root_local
      TZ: UTC
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
volumes:
  mysql-data:
