name: see2026-deploy
services:
  db:
    image: mysql:8.4.8
    environment:
      MYSQL_DATABASE: campus_forum
      MYSQL_USER: campus
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://db:3306/campus_forum?connectionTimeZone=UTC
      DB_USERNAME: campus
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      APP_DEV_LOGIN_ENABLED: 'false'
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports:
      - '127.0.0.1:${WEB_PORT:-8088}:80'
    depends_on:
      - backend
volumes:
  mysql-data:
